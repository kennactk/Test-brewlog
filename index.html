<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>沖煮日誌 Brew Log（離線版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E8DF; --surface:#F4F6F0; --ink:#1D2733; --muted:#5B6863; --line:#C7CFC2;
  --cherry:#A8243A; --cherry-ink:#fff; --chip:#E9EDE4; --focus:#2F6FB0;
  --display:"Bricolage Grotesque","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC","Bricolage Grotesque",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131916; --surface:#1C2320; --ink:#E4E9E1; --muted:#9AA59F; --line:#2F3934;
    --cherry:#E0566B; --cherry-ink:#160A0D; --chip:#252D29; --focus:#7FB2E5;
  }
}
:root[data-theme="dark"]{
  --bg:#131916; --surface:#1C2320; --ink:#E4E9E1; --muted:#9AA59F; --line:#2F3934;
  --cherry:#E0566B; --cherry-ink:#160A0D; --chip:#252D29; --focus:#7FB2E5;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
header.top h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);letter-spacing:-.02em;margin:0;line-height:1.05}
header.top .sub{color:var(--muted);font-size:14px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;padding:8px 0;margin-bottom:12px;border-bottom:1px solid var(--line)}
nav.tabs button{flex:1;font:inherit;font-weight:500;background:none;border:0;color:var(--muted);padding:10px 6px;border-radius:10px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
section[hidden]{display:none}
h2{font-family:var(--display);font-weight:600;font-size:22px;margin:22px 0 10px;letter-spacing:-.01em}
h3{font-size:15px;margin:18px 0 8px;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
@media (max-width:480px){.grid{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
label.f span.hint{font-size:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:72px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.methods{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (max-width:480px){.methods{grid-template-columns:1fr 1fr}}
.methods button{font:inherit;font-size:14px;padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;line-height:1.25}
.methods button small{display:block;color:var(--muted);font-size:11px}
.methods button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.methods button[aria-pressed="true"] small{color:inherit;opacity:.75}

/* the ratio readout: the one loud thing */
.ratio{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 2px;padding:14px 16px;border-radius:16px;background:var(--ink);color:var(--bg)}
.ratio .num{font-family:var(--display);font-weight:800;font-size:clamp(44px,13vw,72px);line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ratio .num .colon{opacity:.45;margin:0 .06em}
.ratio .meta{text-align:right;font-size:13px;opacity:.8}

.cat{margin-bottom:10px}
.cat-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:10px 0 6px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.static{cursor:default;padding:3px 9px;font-size:12px}
.chip.neg{border-style:dashed}
details.wheel{border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin-top:6px;background:var(--bg)}
details.wheel summary{cursor:pointer;padding:8px 0;font-size:14px;font-weight:500;list-style-position:inside}
.selected-line{font-size:13px;color:var(--muted);margin-top:6px}
.stars{display:flex;gap:2px}
.stars button{font-size:26px;line-height:1;background:none;border:0;color:var(--line);cursor:pointer;padding:2px}
.stars button.on{color:var(--cherry)}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{font:inherit;font-weight:600;border-radius:12px;padding:12px 18px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.btn.primary{background:var(--cherry);border-color:var(--cherry);color:var(--cherry-ink)}
.btn.ghost{background:none;color:var(--ink)}
.btn.small{padding:6px 12px;font-size:13px;font-weight:500;border-radius:9px}
.btn.danger{background:none;border-color:var(--cherry);color:var(--cherry)}

.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed var(--line);border-radius:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* bean cards look like a bag label */
.bean{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.bean-name{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.2}
.bean-facts{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px;margin:8px 0}
.bean-facts dt{color:var(--muted)}
.bean-facts dd{margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

/* records */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar label{flex:1;min-width:140px}
.group{margin-bottom:18px}
.group-h{background:var(--ink);color:var(--bg);border-radius:16px 16px 0 0;padding:12px 16px}
.group-h .bean-name{font-size:21px}
.group-h .gmeta{font-size:13px;opacity:.8;margin-top:2px}
.group-body{border:1px solid var(--line);border-top:0;border-radius:0 0 16px 16px;background:var(--surface)}
.brew{padding:12px 16px;border-top:1px solid var(--line)}
.brew:first-child{border-top:0}
.brew-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.brew-date{font-weight:700}
.brew-method{font-size:13px;color:var(--muted)}
.brew-ratio{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.stats{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted);margin:4px 0 6px;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:500}
.brew .chips{margin:4px 0}
.brew .remark{font-size:14px;margin-top:4px}
.brew .acts{display:flex;gap:6px;margin-top:8px}
.storage-note{font-size:12px;color:var(--muted);margin-top:24px;text-align:center}
.req{color:var(--cherry)}
.scan{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px;margin-bottom:14px;border:1px dashed var(--line);border-radius:14px;background:var(--bg)}
.scan-btn{display:inline-block}
.scan-btn.busy{opacity:.55;pointer-events:none}
.scan:has(#scanInput:focus-visible) .scan-btn{outline:2px solid var(--focus);outline-offset:2px}
.scan-status{flex:1;min-width:180px;font-size:13px;color:var(--muted)}
#scanPreview{width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.filled{animation:flash 1.4s ease-out}
@keyframes flash{from{box-shadow:0 0 0 3px var(--cherry)}to{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.filled{animation:none}}
.scan-opt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.scan-opt input{width:auto}
details.raw{flex-basis:100%;font-size:13px}
details.raw summary{cursor:pointer;color:var(--muted)}
.raw-lines{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.raw-lines button{font:inherit;font-size:13px;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.data-tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>沖煮日誌</h1>
    <span class="sub" id="countLine">Brew log</span>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="log" aria-selected="true">記錄沖煮</button>
    <button role="tab" data-tab="records" aria-selected="false">紀錄總覽</button>
    <button role="tab" data-tab="beans" aria-selected="false">咖啡豆</button>
  </nav>

  <!-- LOG -->
  <section id="tab-log">
    <div id="noBeans" class="empty" hidden>
      先新增一款咖啡豆，才能記錄沖煮。<br><br>
      <button class="btn primary" data-goto="beans">新增咖啡豆</button>
    </div>
    <form id="brewForm" class="panel" autocomplete="off" hidden>
      <div class="grid">
        <label class="f full">咖啡豆 <span class="req">*</span>
          <select id="b_bean" required></select>
        </label>
        <label class="f">日期 Date
          <input type="date" id="b_date" required>
        </label>
        <label class="f">磨豆刻度 Grinder setting
          <input id="b_grind" placeholder="例：C40 22 clicks">
        </label>
        <div class="full">
          <label class="f" style="margin-bottom:4px">沖煮方式 Method</label>
          <div class="methods" id="methods"></div>
        </div>
        <label class="f">粉量 Dose (g)
          <input type="number" id="b_dose" inputmode="decimal" step="0.1" min="0" placeholder="15">
        </label>
        <label class="f"><span id="waterLabel">水量 Water (g)</span>
          <input type="number" id="b_water" inputmode="decimal" step="0.1" min="0" placeholder="240">
        </label>
        <div class="full ratio" aria-live="polite">
          <div class="num" id="ratioNum">1<span class="colon">:</span>–</div>
          <div class="meta">粉水比<br>Coffee : Water</div>
        </div>
        <label class="f">悶蒸時間 Bloom (秒)
          <input type="number" id="b_bloom" inputmode="numeric" min="0" placeholder="30">
        </label>
        <label class="f">總時間 Total time
          <input id="b_total" inputmode="numeric" placeholder="2:45 或 165">
          <span class="hint">分:秒，或直接輸入秒數</span>
        </label>
      </div>

      <h3>風味 Tasting notes</h3>
      <div id="noteSelected" class="chips"></div>
      <details class="wheel" id="wheelDetails">
        <summary>從風味輪挑選</summary>
        <div id="wheel"></div>
      </details>

      <h3>口感評語 Tasting remark</h3>
      <div class="chips" id="remarks"></div>
      <label class="f" style="margin-top:10px">補充 Notes
        <textarea id="b_remark" placeholder="下次調整：磨細一點、水溫降 2°C…"></textarea>
      </label>

      <h3>評分 Rating</h3>
      <div class="stars" id="stars"></div>

      <div class="actions">
        <button type="submit" class="btn primary" id="brewSubmit">儲存紀錄</button>
        <button type="button" class="btn ghost" id="brewCancel" hidden>取消編輯</button>
      </div>
    </form>
  </section>

  <!-- RECORDS -->
  <section id="tab-records" hidden>
    <div class="toolbar">
      <label class="f">排序
        <select id="sortBy">
          <option value="az">豆名 A → Z</option>
          <option value="za">豆名 Z → A</option>
          <option value="recent">最近沖煮</option>
          <option value="count">沖煮次數</option>
        </select>
      </label>
      <label class="f">方式
        <select id="filterMethod"><option value="">全部方式</option></select>
      </label>
    </div>
    <div id="records"></div>
  </section>

  <!-- BEANS -->
  <section id="tab-beans" hidden>
    <form id="beanForm" class="panel" autocomplete="off">
      <h2 style="margin-top:0" id="beanFormTitle">新增咖啡豆</h2>
      <div class="scan" id="scanBox">
        <label class="btn scan-btn" for="scanInput" id="scanBtn">拍照辨識標籤</label>
        <input type="file" id="scanInput" class="vh" accept="image/*">
        <img id="scanPreview" alt="標籤照片預覽" hidden>
        <div class="scan-status" id="scanStatus" aria-live="polite">拍下或選擇豆袋標籤照片，自動填入下方欄位。</div>
        <label class="scan-opt"><input type="checkbox" id="scanZh" checked> 標籤含中文（首次需下載較大的中文辨識檔）</label>
        <details class="raw" id="rawBox" hidden>
          <summary>辨識出的文字：點一行，填入目前選取的欄位</summary>
          <div class="raw-lines" id="rawLines"></div>
        </details>
      </div>
      <div class="grid">
        <label class="f full">咖啡名 Name <span class="req">*</span>
          <input id="c_name" required placeholder="例：Ethiopia Guji Hambela">
        </label>
        <label class="f">產區 Origin
          <input id="c_origin" placeholder="衣索比亞 古吉">
        </label>
        <label class="f">品種 Variety
          <input id="c_variety" placeholder="Heirloom / Geisha">
        </label>
        <label class="f">處理方法 Process
          <input id="c_process" list="processList" placeholder="水洗 Washed">
          <datalist id="processList">
            <option value="水洗 Washed"><option value="日曬 Natural"><option value="蜜處理 Honey">
            <option value="厭氧發酵 Anaerobic"><option value="濕剝 Wet-hulled"><option value="二氧化碳浸漬 Carbonic maceration">
          </datalist>
        </label>
        <label class="f">烘豆商 Roaster
          <input id="c_roaster" placeholder="選填">
        </label>
        <label class="f full">標示風味 Label flavours
          <input id="c_label" placeholder="茉莉、水蜜桃、伯爵茶">
        </label>
      </div>
      <div class="actions">
        <button type="submit" class="btn primary" id="beanSubmit">新增咖啡豆</button>
        <button type="button" class="btn ghost" id="beanCancel" hidden>取消編輯</button>
      </div>
    </form>
    <h2>我的咖啡豆</h2>
    <div id="beanList"></div>
  </section>

  <p class="storage-note" id="storageNote">紀錄儲存在這個瀏覽器中。清除瀏覽器資料或換裝置前，請先匯出備份。</p>
  <div class="data-tools">
    <button class="btn small ghost" id="exportBtn" type="button">匯出備份</button>
    <label class="btn small ghost" for="importInput">匯入備份</label>
    <input type="file" id="importInput" class="vh" accept="application/json,.json">
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';

/* ---------- reference data ---------- */
const METHODS = [
  {id:'espresso', zh:'義式咖啡機', en:'Espresso'},
  {id:'pourover', zh:'手沖', en:'Pour over'},
  {id:'moka', zh:'摩卡壺', en:'Moka pot'},
  {id:'aeropress', zh:'愛樂壓', en:'AeroPress'},
];
const methodName = id => { const m = METHODS.find(x=>x.id===id); return m ? m.zh : '—'; };

// SCA coffee taster's flavour wheel, condensed
const WHEEL = [
  {cat:'花香 Floral', color:'#D9739B', notes:['紅茶 Black tea','洋甘菊 Chamomile','玫瑰 Rose','茉莉 Jasmine']},
  {cat:'果香 Fruity', color:'#C8323F', notes:['黑莓 Blackberry','覆盆子 Raspberry','藍莓 Blueberry','草莓 Strawberry','葡萄乾 Raisin','李子乾 Prune','椰子 Coconut','櫻桃 Cherry','石榴 Pomegranate','鳳梨 Pineapple','葡萄 Grape','蘋果 Apple','桃子 Peach','梨 Pear','葡萄柚 Grapefruit','柳橙 Orange','檸檬 Lemon','萊姆 Lime']},
  {cat:'酸 / 發酵 Sour / Fermented', color:'#D9B21F', notes:['酸香 Sour aromatics','醋酸 Acetic','蘋果酸 Malic','檸檬酸 Citric','酒香 Winey','威士忌 Whiskey','發酵 Fermented','過熟 Overripe']},
  {cat:'植物 Green / Vegetative', color:'#4F9A55', notes:['橄欖油 Olive oil','生青 Raw','青草 Fresh green','豆莢 Beany','乾草 Hay-like','蔬菜 Vegetative']},
  {cat:'其他 Other', color:'#5E8D93', notes:['紙味 Papery','木質 Woody','霉味 Musty','土味 Earthy','橡膠 Rubber','藥味 Medicinal']},
  {cat:'烘焙 Roasted', color:'#8A5A3B', notes:['菸斗菸草 Pipe tobacco','菸草 Tobacco','焦味 Burnt','煙燻 Smoky','穀物 Cereal','麥芽 Malt','烤麵包 Toast']},
  {cat:'香料 Spices', color:'#9E2F2F', notes:['黑胡椒 Pepper','茴香 Anise','肉豆蔻 Nutmeg','肉桂 Cinnamon','丁香 Clove']},
  {cat:'堅果 / 可可 Nutty / Cocoa', color:'#7B4A2A', notes:['花生 Peanut','榛果 Hazelnut','杏仁 Almond','巧克力 Chocolate','黑巧克力 Dark chocolate','可可 Cocoa']},
  {cat:'甜 Sweet', color:'#E08A2E', notes:['紅糖 Brown sugar','糖蜜 Molasses','楓糖 Maple syrup','焦糖 Caramel','蜂蜜 Honey','香草 Vanilla']},
];
const NOTE_COLOR = {};
WHEEL.forEach(g => g.notes.forEach(n => NOTE_COLOR[n] = g.color));

const REMARKS = [
  {t:'淡 / 水感 Weak', neg:true},{t:'酸 Sour', neg:true},{t:'苦 Bitter', neg:true},
  {t:'單薄 Thin', neg:true},{t:'混濁 Muddy', neg:true},{t:'澀 Astringent', neg:true},
  {t:'平淡 Flat', neg:true},{t:'刺激 Harsh', neg:true},
  {t:'平衡 Balanced'},{t:'甜感佳 Sweet'},{t:'乾淨 Clean'},{t:'醇厚 Full body'},{t:'餘韻長 Long finish'},
];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const num = v => { const n = parseFloat(v); return isFinite(n) && n > 0 ? n : null; };
const parseTime = v => {
  v = String(v||'').trim(); if (!v) return null;
  if (v.includes(':')) { const [m,s] = v.split(':'); const t = (parseInt(m)||0)*60 + (parseInt(s)||0); return t>0?t:null; }
  const n = parseInt(v); return n>0?n:null;
};
const fmtTime = s => s==null ? '—' : `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const ratioOf = (d,w) => (d && w) ? Math.round((w/d)*10)/10 : null;
const cmpName = (a,b) => a.localeCompare(b, ['en','zh-Hant'], {sensitivity:'base', numeric:true});
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }

/* ---------- storage: this browser ---------- */
const state = { beans: [], brews: [] };
const LS = 'coffee-brew-log-v1';
function loadLocal(){
  try { const raw = localStorage.getItem(LS); if (raw){ const d = JSON.parse(raw); state.beans = d.beans||[]; state.brews = d.brews||[]; } } catch(e){}
}
function saveLocal(){
  try { localStorage.setItem(LS, JSON.stringify(state)); return true; }
  catch(e){ toast('無法儲存到瀏覽器，請匯出備份'); return false; }
}
async function putDoc(kind, obj){

function renderRecords(){
  const sort = $('#sortBy').value, fm = $('#filterMethod').value;
  const brews = state.brews.filter(b => !fm || b.method===fm);
  const groups = state.beans.map(bean => {
    const list = brews.filter(b=>b.beanId===bean.id)
      .sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0));
    return { bean, list, latest: list[0] ? list[0].date : '' };
  }).filter(g => g.list.length);
  const byName = (a,b)=>cmpName(a.bean.name||'', b.bean.name||'');
  if (sort==='az') groups.sort(byName);
  else if (sort==='za') groups.sort((a,b)=>byName(b,a));
  else if (sort==='recent') groups.sort((a,b)=> b.latest.localeCompare(a.latest) || byName(a,b));
  else if (sort==='count') groups.sort((a,b)=> b.list.length-a.list.length || byName(a,b));

  const el = $('#records');
  if (!state.brews.length){ el.innerHTML = '<div class="empty">還沒有沖煮紀錄。<br><br><button class="btn primary" data-goto="log">記錄第一杯</button></div>'; return; }
  if (!groups.length){ el.innerHTML = '<div class="empty">這個沖煮方式還沒有紀錄。</div>'; return; }

  el.innerHTML = groups.map(({bean,list}) => {
    const ratios = list.map(b=>b.ratio).filter(Boolean);
    const avg = ratios.length ? (ratios.reduce((s,x)=>s+x,0)/ratios.length).toFixed(1) : null;
    const rated = list.filter(b=>b.rating);
    const best = rated.length ? rated.reduce((a,b)=> b.rating>a.rating?b:a) : null;
    const meta = [bean.origin, bean.variety, bean.process].filter(Boolean).map(esc).join('，');
    return `<div class="group">
      <div class="group-h">
        <div class="bean-name">${esc(bean.name)}</div>
        <div class="gmeta">${meta ? meta + '<br>' : ''}${list.length} 次沖煮${avg ? `，平均粉水比 1:${avg}` : ''}${best ? `，最高分 ${'★'.repeat(best.rating)}（${esc(best.date)}）` : ''}</div>
      </div>
      <div class="group-body">${list.map(brewRow).join('')}</div>
    </div>`;
  }).join('');
}

function brewRow(b){
  const isEsp = b.method==='espresso';

    b.grind ? `刻度 <b>${esc(b.grind)}</b>` : '',

  const notes = (b.notes||[]).map(n => `<span class="chip static"><span class="dot" style="background:${NOTE_COLOR[n]||'#888'}"></span>${esc(n)}</span>`).join('');

const SCAN_IDLE = '拍下或選擇豆袋標籤照片，自動填入下方欄位。';
const TESS_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let tessLoad = null, worker = null, workerLangs = '';
function loadTesseract(){
  if (window.Tesseract) return Promise.resolve();
  if (!tessLoad) tessLoad = new Promise((res, rej) => {
    const sc = document.createElement('script'); sc.src = TESS_URL; sc.onload = res;
    sc.onerror = () => { tessLoad = null; rej(new Error('load')); };
    document.head.appendChild(sc);
  });
  return tessLoad;
}
async function getWorker(langs, onProgress){
  if (worker && workerLangs === langs) return worker;
  if (worker){ try { await worker.terminate(); } catch(e){} worker = null; }
  worker = await Tesseract.createWorker(langs.split('+'), 1, { logger: m => onProgress(m) });
  workerLangs = langs;
  return worker;
}
async function prepImage(file){
  try {
    const img = await createImageBitmap(file);
    const s = Math.min(1, 2000 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    const g = c.getContext('2d'); g.filter = 'grayscale(1) contrast(1.25)';
    g.drawImage(img, 0, 0, c.width, c.height);
    return c;
  } catch(e){ return file; }
}

  term('Caturra','caturra','卡杜拉'), term('Catuai','catuai','catuaí','卡杜艾','卡圖艾'), term('Pacamara','pacamara','帕卡瑪拉'),
  term('Pacas','pacas','帕卡斯'), term('Maragogype','maragogype','maragogipe','象豆'), term('Castillo','castillo','卡斯提優'),
  term('Colombia','variedad colombia'), term('Sidra','sidra','希爪'), term('Wush Wush','wush wush','wushwush'),
  term('Laurina','laurina','蘿瑞娜'), term('Mokka','mokka','mocca'), term('Catimor','catimor','卡蒂姆'),
  term('Mundo Novo','mundo novo','新世界'), term('Java','java'), term('Heirloom','heirloom','landrace','原生種','原生品種'),
  term('74110','74110'), term('74112','74112'), term('74158','74158'), term('Kurume','kurume'), term('Dega','dega'),

const PROCESSES = [
  term('二氧化碳浸漬 Carbonic maceration','carbonic maceration','carbonic','二氧化碳浸漬'),
  term('厭氧發酵 Anaerobic','anaerobic','厭氧'), term('濕剝 Wet-hulled','wet-hulled','wet hulled','giling basah','濕剝'),
  term('蜜處理 Honey','honey process','honey processed','yellow honey','red honey','black honey','white honey','蜜處理','黃蜜','紅蜜','黑蜜','白蜜'),
  term('水洗 Washed','fully washed','washed','水洗'), term('日曬 Natural','natural process','natural','sun-dried','dry process','日曬','日晒'),

const PROCESS_HONEY_LABEL = term('蜜處理 Honey','honey','蜜');
const FLAVOR_EXTRA = [
  ['佛手柑 Bergamot','bergamot','佛手柑'], ['伯爵茶 Earl Grey','earl grey','伯爵茶','伯爵'], ['水蜜桃 Peach','white peach','水蜜桃','白桃'],
  ['杏桃 Apricot','apricot','杏桃'], ['熱帶水果 Tropical fruit','tropical fruit','tropical','熱帶水果'], ['柑橘 Citrus','citrus','柑橘'],

  ['芒果 Mango','mango','芒果'], ['百香果 Passion fruit','passion fruit','passionfruit','百香果'], ['西瓜 Watermelon','watermelon','西瓜'],
  ['哈密瓜 Melon','melon','cantaloupe','哈密瓜'], ['橘子 Mandarin','mandarin','tangerine','橘子'], ['柚子 Yuzu','yuzu','柚子'],
  ['葡萄乾 Raisin','raisin','葡萄乾'], ['無花果 Fig','fig','無花果'], ['蔓越莓 Cranberry','cranberry','蔓越莓'],
  ['黑醋栗 Blackcurrant','blackcurrant','black currant','黑醋栗'], ['紅酒 Red wine','red wine','紅酒'], ['蘭姆酒 Rum','rum','蘭姆'],
  ['烏龍茶 Oolong','oolong','烏龍'], ['綠茶 Green tea','green tea','綠茶'], ['花香 Floral','floral','花香'], ['橙花 Orange blossom','orange blossom','橙花'],
  ['薰衣草 Lavender','lavender','薰衣草'], ['奶油 Butter','buttery','butter','奶油'], ['牛奶巧克力 Milk chocolate','milk chocolate','牛奶巧克力'],
  ['太妃糖 Toffee','toffee','太妃糖'], ['黑糖 Panela','panela','黑糖'], ['甘蔗 Sugarcane','sugarcane','sugar cane','甘蔗'],

const FLAVORS = [
  ...WHEEL.flatMap(g => g.notes.map(n => { const zh = n.split(' ')[0], en = n.slice(zh.length+1);
    return term(n, en.toLowerCase(), ...(zh.length > 1 ? [zh] : [])); })),
  ...FLAVOR_EXTRA,
].filter((t, i, arr) => arr.findIndex(x => x[0] === t[0]) === i);

// longest-first matching; matched text is blanked so "葡萄柚" doesn't also count as "葡萄"
function findTerms(text, terms){
  let work = text; const found = [];
  const sorted = [...terms].sort((a,b) => b[1].source.length - a[1].source.length);
  for (const [display, re] of sorted){
    re.lastIndex = 0;
    const m = re.exec(work);
    if (m){ found.push({display, at:m.index}); work = work.replace(re, s => ' '.repeat(s.length)); }
  }
  return found.sort((a,b) => a.at - b.at).map(f => f.display);
}

const FIELD_LABELS = {
  name: '品名|豆名|名稱|咖啡名|coffee name|name|lot name|lot',
  origin: '產區|產地|國家|地區|origin|region|country',
  variety: '品種|variety|varietals?|cultivars?',
  process: '處理法|處理方式|處理|process(?:ing)?|processed',
  roaster: '烘焙商|烘豆商|烘焙者|roaster|roasted by',
  label: '風味描述|風味|杯測風味|杯測|flavou?r notes?|flavou?rs?|tasting notes?|cup(?:ping)? notes?|notes',
  _other: '海拔|altitude|elevation|masl|烘焙度|roast level|roast date|烘焙日期|淨重|net wt|weight|producer|生產者|farm|莊園|農場',
};
const ANY_LABEL = new RegExp(`(?:^|\\s)(?:${Object.values(FIELD_LABELS).join('|')})\\s*[:：]`, 'i');
function labelled(lines, key){
  const re = new RegExp(`(?:^|\\s)(?:${FIELD_LABELS[key]})\\s*[:：]\\s*(.*)$`, 'i');
  for (const line of lines){
    const m = line.match(re); if (!m) continue;
    let v = m[1]; const cut = v.search(ANY_LABEL); if (cut > 0) v = v.slice(0, cut);
    v = v.replace(/^[\s|·•\-–]+|[\s|·•\-–]+$/g, '');
    if (v) return v;
  }
  return '';
}

function parseLabel(raw){
  const text = raw.replace(/(?<=[\u3400-\u9fff])[ \t]+(?=[\u3400-\u9fff])/g, '');
  const lines = text.split(/\n+/).map(l => l.replace(/\s+/g, ' ').trim()).filter(l => l.length > 1);
  const out = { name:'', origin:'', variety:'', process:'', roaster:'', label:'' };
  const guessed = new Set();

  // process
  const pl = labelled(lines, 'process');
  if (pl){ const hits = findTerms(pl, PROCESSES); if (!hits.length) { PROCESS_HONEY_LABEL[1].lastIndex = 0; if (PROCESS_HONEY_LABEL[1].test(pl)) hits.push(PROCESS_HONEY_LABEL[0]); }
    out.process = hits.length ? hits.join(' ') : pl; }
  else { out.process = findTerms(text, PROCESSES).join(' '); }

  // variety
  out.variety = labelled(lines, 'variety') || findTerms(text, VARIETIES).join(', ');

  // origin
  const ol = labelled(lines, 'origin');
  const countries = findTerms(text, COUNTRIES), regions = findTerms(text, REGIONS);
  out.origin = ol || [...countries, ...regions].join(', ');

  // flavours
  const fl = labelled(lines, 'label');
  out.label = fl ? fl.replace(/\s*[,，/|;；·•]\s*/g, '、') : findTerms(text, FLAVORS).join('、');

  // roaster
  out.roaster = labelled(lines, 'roaster');

  // name: labelled, then a farm/station/lot line, then country + region + process
  out.name = labelled(lines, 'name');
  if (!out.name){
    const hasPlace = l => [...COUNTRIES, ...REGIONS].some(([, re]) => { re.lastIndex = 0; return re.test(l); });
    const placeLine = lines.find(l => !/[:：]/.test(l) && l.length <= 40 && hasPlace(l));
    let farm = lines.find(l => /\b(farm|estate|finca|hacienda|station|cooperative|co-op|micro ?lot)\b|莊園|農場|處理廠|處理站|合作社/i.test(l) && l.length <= 60 && l !== placeLine);
    if (farm) farm = farm.replace(/^[^:：]{0,24}[:：]\s*/, '');
    if (farm && ANY_LABEL.test(farm)) farm = '';
    const parts = [placeLine, farm].filter(Boolean);
    if (parts.length){ out.name = parts.join(' '); guessed.add('name'); }
  }
  if (!out.name && (countries.length || regions.length)){
    const en = s => s.split(' ').slice(1).join(' ');
    out.name = [countries[0] && en(countries[0]), regions[0] && en(regions[0]), out.process && /[A-Za-z]/.test(out.process) ? out.process.replace(/^[^A-Za-z]+/, '').split(' ')[0] : '']
      .filter(Boolean).join(' ');
    if (out.name) guessed.add('name');
  }
  return { fields: out, lines, guessed };
}

let lastBeanField = 'c_name';
$('#beanForm').addEventListener('focusin', e => { if (e.target.id && e.target.id.startsWith('c_')) lastBeanField = e.target.id; });
$('#rawLines').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const el = $('#' + lastBeanField); el.value = b.textContent; flash(el); el.focus();
});
function flash(el){ el.classList.remove('filled'); void el.offsetWidth; el.classList.add('filled'); }

function initScan(){
  try { $('#scanZh').checked = localStorage.getItem(LS + ':zh') !== '0'; } catch(e){}
  $('#scanZh').addEventListener('change', e => { try { localStorage.setItem(LS + ':zh', e.target.checked ? '1' : '0'); } catch(err){} });
  const inp = $('#scanInput'), btn = $('#scanBtn'), st = $('#scanStatus'), pv = $('#scanPreview');
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0]; inp.value = '';
    if (!f) return;
    try { if (pv.src) URL.revokeObjectURL(pv.src); pv.src = URL.createObjectURL(f); pv.hidden = false; } catch(e){}
    btn.classList.add('busy');
    const langs = $('#scanZh').checked ? 'eng+chi_tra' : 'eng';
    try {
      st.textContent = '正在載入辨識引擎…';
      await loadTesseract();
      const progress = m => {
        const p = Math.round((m.progress || 0) * 100);
        if (m.status === 'recognizing text') st.textContent = `正在辨識文字… ${p}%`;
        else if (/load|download/i.test(m.status || '')) st.textContent = `正在下載辨識檔… ${p}%`;
      };
      const w = await getWorker(langs, progress);
      st.textContent = '正在辨識文字…';
      const img = await prepImage(f);
      const { data } = await w.recognize(img);
      const { fields, lines, guessed } = parseLabel(data.text || '');
      let n = 0;
      beanFields.forEach(k => { if (fields[k]){ const el = $('#c_'+k); el.value = fields[k]; flash(el); n++; } });
      $('#rawLines').innerHTML = lines.map(l => `<button type="button">${esc(l)}</button>`).join('');
      $('#rawBox').hidden = !lines.length;
      if (!lines.length) st.textContent = '沒有辨識到文字，請換一張光線充足、正對標籤的照片。';
      else if (!n) st.textContent = '辨識到文字，但沒有對應的欄位。展開下方文字，點選填入。';
      else st.textContent = `已填入 ${n} 個欄位，請逐一確認。` + (!fields.name ? '沒讀到咖啡名，請手動補上。' : guessed.has('name') ? '咖啡名是推測的，請確認。' : '');
    } catch(e){
      st.textContent = navigator.onLine === false
        ? '首次使用需要連網下載辨識引擎，請連網後再試。'
        : '辨識引擎載入失敗。請確認網路連線，或改用瀏覽器直接開啟這個檔案。';
    } finally {
      btn.classList.remove('busy');
    }
  });
}

resetBrewForm(false);
loadLocal();
render();
initScan();
})();
